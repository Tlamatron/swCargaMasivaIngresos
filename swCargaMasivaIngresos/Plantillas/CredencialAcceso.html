<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        @page {
            size: 85.6mm 53.98mm; /* Tamaño estándar de tarjeta ID / Credencial */
            margin: 0;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 5mm;
            background-image: url('{{MarcaAguaBase64}}');
            background-size: cover;
            background-position: center;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #691C32;
            padding-bottom: 2mm;
        }
        .logo {
            max-height: 12mm;
        }
        .content {
            margin-top: 3mm;
            font-size: 8pt;
        }
        .nombre {
            font-weight: bold;
            color: #10353A;
            font-size: 9pt;
        }
        .qr-container {
            float: right;
            width: 20mm;
            height: 20mm;
        }
        .qr-container img {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="{{LogoBase64}}" class="logo" alt="Logo Institucional" />
    </div>
    <div class="content">
        <div class="qr-container">
            <img src="{{QRPasswordBase64}}" alt="QR Acceso" />
        </div>
        <div><strong>Usuario:</strong> {{UsuarioLogin}}</div>
        <div class="nombre">{{NombreCompleto}}</div>
        <div><strong>Adscripción:</strong> {{AreaAdscripcion}}</div>
        <div><strong>Rol:</strong> {{Rol}}</div>
    </div>
</body>
</html>
